<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الإشارة - صفحة الترحيب</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #3B82F6; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-image: url('file:///C:/Users/YourName/Desktop/Project/sign_language_bg.jpg');
            
            background-size: cover; 
            /* ... بقية الخصائص ... */
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 900;
            background-color: rgba(255, 255, 255, 0.85); 
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .explore-btn {
            display: inline-block;
            text-decoration: none;
            background-color: var(--accent);
            color: white;
            padding: 25px 60px;
            border-radius: 20px;
            font-size: 28px;
            font-weight: 900;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
            z-index: 10;
        }

        .explore-btn:hover {
            background-color: #2563EB;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.7);
        }
    </style>
</head>
<body>
    <h1>أهلاً بك في مشروع الإشارة</h1>
    <a href="index.html" class="explore-btn">ابدأ واستكشف</a>
</body>
</html>
